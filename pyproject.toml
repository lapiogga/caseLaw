[project]
name = "caselaw-mcp"
version = "0.11.0"
description = "법제처 국가법령정보 공동활용 OpenAPI 기반 MCP 서버 (변호사·로펌 AI 보조, 결과 예측 + 문서 초안 자동화)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "박재우", email = "lapiogga@gmail.com" },
]
keywords = ["mcp", "law", "precedent", "korean-law", "anthropic"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "xmltodict>=0.13.0",
  "aiosqlite>=0.20.0",
  "tenacity>=8.3.0",
  "structlog>=24.1.0",
  # HTTP transport (ChatGPT·원격 MCP 클라이언트용; stdio 모드에서는 import 안 됨)
  "starlette>=0.37.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
  "ruff>=0.5.0",
]

[project.scripts]
caselaw-mcp = "caselaw_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caselaw_mcp"]

# sdist 는 코드·문서·테스트만 포함. promo 영상·캡처·plan 메타는 제외
# (hatchling 기본은 워킹트리 전체 → mp4/png 가 들어가 비대해짐).
[tool.hatch.build.targets.sdist]
include = [
  "src/caselaw_mcp/**",
  "tests/**",
  "docs/**/*.md",
  "scripts/*.ps1",
  "scripts/*.bat",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
  "VERSION-STAMP.md",
  ".env.example",
]
# 패키지 시드 데이터 (citizen_data, prediction_data) 는 src/caselaw_mcp 안에 있어
# packages 옵션으로 자동 wheel 포함됨 — 별도 force-include 불필요.

# ─────────────────────────────────────────────
# Ruff (lint + format 통합)
# ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = ["E501"]  # line length: ruff format이 처리

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

# ─────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error"]
